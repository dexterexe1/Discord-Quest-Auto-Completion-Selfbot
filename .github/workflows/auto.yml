name: Run quest auto completion bot

on:
  workflow_dispatch: {}
  schedule:
    - cron: '15 0 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Check if TOKEN is set
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "❌ TOKEN is empty. Please add the secret in Settings."
            exit 1
          fi
          echo "Token length: ${#TOKEN} (should be around 60-70)"
          echo "First 4 chars: ${TOKEN:0:4} (should show the beginning of your token)"

      - name: Test token with Discord
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: $TOKEN" https://discord.com/api/v9/users/@me)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Token is VALID! Running bot..."
          else
            echo "❌ Token is INVALID. Are you using your own account token (not a bot token)?"
            exit 1
          fi

      - name: Run the bot
        env:
          TOKEN: ${{ secrets.TOKEN }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: npm run github
