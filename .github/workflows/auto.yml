name: Run quest auto completion bot

on:
  workflow_dispatch: {}
  schedule:
    - cron: '15 0 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # ---------- NEW: Token test step ----------
      - name: 🔍 Test Discord token validity
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: |
          echo "Testing token with Discord API..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: ${TOKEN}" https://discord.com/api/v9/users/@me)
          echo "HTTP status code: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Token is VALID. The bot should work."
          else
            echo "❌ Token is INVALID (got HTTP $HTTP_CODE)."
            echo "Possible reasons: token expired, wrong type, 2FA not included, or secret misformatted."
            exit 1
          fi

      # ---------- Original bot runner ----------
      - name: Run the bot
        env:
          TOKEN: ${{ secrets.TOKEN }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          npm run github
